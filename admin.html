<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin</title>

<style>
body { font-family: Arial; background:#f5f5f5; }
.container {
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    margin-top:50px;
    border-radius:10px;
}
input, select, textarea {
    width:100%;
    padding:10px;
    margin-top:10px;
}
button {
    background:#1e3d2f;
    color:white;
    border:none;
    padding:10px;
    margin-top:10px;
    width:100%;
}
</style>
</head>

<body>

<div class="container">
<h2>Agregar Propiedad</h2>

<input id="ciudad" placeholder="Ciudad">
<select id="tipo">
<option>Casa</option>
<option>Finca</option>
<option>Apartamento</option>
<option>Apartaestudio</option>
</select>

<input id="precio" placeholder="Precio">
<input id="habitaciones" type="number" placeholder="Habitaciones">
<input id="baños" type="number" placeholder="Baños">

<input id="fotos" placeholder="URLs separadas por coma">
<textarea id="desc" placeholder="Descripción"></textarea>

<button onclick="guardar()">Guardar</button>
</div>

<script>
async function guardar(){

    const nueva = {
        ciudad: document.getElementById("ciudad").value,
        tipo: document.getElementById("tipo").value,
        precio: document.getElementById("precio").value,
        habitaciones: document.getElementById("habitaciones").value,
        baños: document.getElementById("baños").value,
        desc: document.getElementById("desc").value,
        fotos: document.getElementById("fotos").value.split(",")
    };

    await fetch("http://localhost:3000/propiedades", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(nueva)
    });

    alert("Propiedad guardada 🚀");
}
</script>

</body>
</html>
