<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>C.S.P RAÍZ</title>

<style>
body { margin:0; font-family: Arial; background:#f5f5f5; }

header {
    background:#1e3d2f;
    color:white;
    padding:20px;
    text-align:center;
}

.container {
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(300px,1fr));
    gap:20px;
    padding:20px;
}

.card {
    background:white;
    border-radius:10px;
    overflow:hidden;
}

.card img {
    width:100%;
    height:200px;
    object-fit:cover;
}

.card-content { padding:15px; }

button {
    background:#1e3d2f;
    color:white;
    border:none;
    padding:10px;
    width:100%;
}

/* MODAL ARREGLADO */
.modal {
    display:none;
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    top:0;
    left:0;
    overflow-y:auto;
}

.modal-content {
    background:white;
    margin:5% auto;
    padding:20px;
    width:90%;
    max-width:600px;
}
</style>
</head>

<body>

<header>
<h1>C.S.P RAÍZ</h1>
</header>

<div class="container" id="propiedades"></div>

<div class="modal" id="modal">
<div class="modal-content" id="modalContent"></div>
</div>

<script>

let propiedades = [];

// 🔹 CARGAR DESDE MYSQL
async function cargar(){
    const res = await fetch("http://localhost:3000/propiedades");
    propiedades = await res.json();
    mostrar();
}

// 🔹 MOSTRAR
function mostrar(){
    const cont = document.getElementById("propiedades");
    cont.innerHTML = "";

    propiedades.forEach((p,i)=>{
        cont.innerHTML += `
        <div class="card">
            <img src="${p.fotos[0]}">
            <div class="card-content">
                <h3>${p.tipo} en ${p.ciudad}</h3>
                <p>${p.precio}</p>
                <button onclick="verDetalle(${i})">Ver</button>
            </div>
        </div>
        `;
    });
}

// 🔹 DETALLE
function verDetalle(i){
    const p = propiedades[i];

    let galeria="";
    p.fotos.forEach(f=>{
        galeria += `<img src="${f}" style="width:100%; margin-top:10px;">`;
    });

    document.getElementById("modal").style.display="block";
    document.body.style.overflow="hidden";

    document.getElementById("modalContent").innerHTML=`
        <h2>${p.tipo} en ${p.ciudad}</h2>
        <p>${p.precio}</p>
        <p>${p.habitaciones} hab | ${p.baños} baños</p>
        <p>${p.descripcion}</p>
        ${galeria}
        <a href="https://wa.me/573001234567">
            <button>WhatsApp</button>
        </a>
    `;
}

// 🔹 CERRAR
window.onclick = e=>{
    if(e.target.id==="modal"){
        document.getElementById("modal").style.display="none";
        document.body.style.overflow="auto";
    }
}

cargar();

</script>

</body>
</html>
